[workspace]
resolver = "2"
members = ["crates/pweq-core", "crates/pweq-daemon", "crates/pweq-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/gsusrafael/pipewire-equalizer"

[workspace.dependencies]
pweq-core = { path = "crates/pweq-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
